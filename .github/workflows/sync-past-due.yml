name: Sync Past Due Cask

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Casks/past-due.rb from michaelstonis/Past-Due
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/michaelstonis/Past-Due/main/Casks/past-due.rb" -o Casks/past-due.rb
          if ! git diff --quiet Casks/past-due.rb; then
            VER=$(sed -n 's/.*version "\([^"]*\)".*/\1/p' Casks/past-due.rb | head -n 1)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks/past-due.rb
            git commit -m "chore(cask): update past-due to v${VER}"
            git push origin HEAD:main
          else
            echo "Casks/past-due.rb is already up to date."
          fi
